[package]
name = "openvm-poseidon2"
description = "OpenVM library for poseidon2"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
openvm-poseidon2-guest = { workspace = true }

[target.'cfg(not(target_os = "zkvm"))'.dependencies]
p3-baby-bear = { workspace = true }
p3-field = { workspace = true }
p3-symmetric = { workspace = true }

[dev-dependencies]
openvm-build = { workspace = true }
openvm-instructions = { workspace = true, default-features = false }
openvm-sdk = { workspace = true, default-features = false }
openvm-stark-sdk = { workspace = true }
openvm-circuit = { workspace = true, default-features = false, features = ["test-utils", "parallel"] }
openvm-transpiler = { workspace = true, default-features = false }
openvm-poseidon2-transpiler = { workspace = true, default-features = false }
openvm-poseidon2-circuit = { workspace = true, default-features = false }
openvm-rv32im-transpiler = { workspace = true, default-features = false }
eyre = { workspace = true }
rand = { workspace = true }

[features]
default = []
aot = ["openvm-sdk/aot"]
# Internal feature for testing only.
cuda = ["openvm-poseidon2-circuit/cuda"]
