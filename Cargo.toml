[workspace.package]
version = "2.0.2"
edition = "2021"
rust-version = "1.91.1"
authors = ["OpenVM Authors"]
homepage = "https://openvm.dev"
repository = "https://github.com/amintalebi/openvm-poseidon2"
license = "MIT OR Apache-2.0"

[workspace]
members = []

# Optimized dev profile used for tests (see AGENTS.md)
[profile.fast]
opt-level = 1
debug = true
debug-assertions = true
incremental = true

[profile.release]
lto = "thin"
